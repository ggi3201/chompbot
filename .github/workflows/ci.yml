name: CI

# Build, type-check and test on GitHub's runners for every push and pull request.
# Runs only where the repository is public: the private copy is verified by its deploy job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The preview tests drive a browser: use Playwright's matched one, not the runner's Google Chrome (it hangs there).
      - run: pnpm --filter @chomp/api exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm build
      - run: npx tsc --noEmit -p packages/web/tsconfig.json
      - run: pnpm test
