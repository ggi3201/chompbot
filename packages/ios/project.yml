name: Chomp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"
  LibrariesDev:
    url: https://github.com/Jakubantalik/Libraries.dev
    revision: 9a42e88847dab0ac145733f15cf90535e9cb59ab

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    # The app and its widget extension must carry the same version.
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Chomp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Chomp
    dependencies:
      - package: MarkdownUI
      - package: LibrariesDev
        product: ThinkingOrbsKit
      - package: LibrariesDev
        product: VoiceGlowKit
      - target: ChompWidget
    entitlements:
      path: Chomp/Chomp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.$(CHOMP_BUNDLE_ID)
        # 'production' is correct even for TestFlight builds — that's the
        # APNs environment, not the Apple developer environment. Xcode-local
        # debug installs are the only thing that should be 'development'.
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: Chomp/Info.plist
      properties:
        CFBundleDisplayName: Chomp
        ChompDefaultServerHost: "$(CHOMP_DEFAULT_SERVER_HOST)"
        ChompAppGroup: "group.$(CHOMP_BUNDLE_ID)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - chomp
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Lets you take a photo and send it to Chomp in a chat."
        NSMicrophoneUsageDescription: "Lets you speak a message. The audio is sent to your Chomp server and turned into text."
        NSLocationWhenInUseUsageDescription: "Lets Chomp answer 'where am I?' and route location-aware questions to your agent."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Lets Chomp know where you are when you or an agent asks, also with the app closed or the phone locked. Your phone tells your own Chomp server when you move, using very little battery."
        NSCalendarsFullAccessUsageDescription: "Lets Chomp read and add calendar events on your behalf."
        NSRemindersFullAccessUsageDescription: "Lets Chomp read and create reminders on your behalf."
        NSContactsUsageDescription: "Lets Chomp look up people by name so the agent can email or message them."
        NSPhotoLibraryUsageDescription: "Lets Chomp retrieve recent photos when you ask the agent about them."
        NSPhotoLibraryAddUsageDescription: "Lets Chomp save images it generates or receives back into your photo library."
        NSHealthShareUsageDescription: "Lets Chomp read steps, sleep, heart rate, and active energy so the agent can summarize them."
        NSHealthUpdateUsageDescription: "Reserved — Chomp does not currently write health data."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CHOMP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Chomp/Chomp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  ChompWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChompWidget
      - path: Chomp/AppConfig.swift
      - path: Chomp/PhoneCards/PhoneCard.swift
      - path: Chomp/PhoneCards/PhoneCardStore.swift
      - path: Chomp/PhoneCards/PhoneCardAlerts.swift
      - path: Chomp/PhoneCards/PhoneCardLink.swift
    entitlements:
      path: ChompWidget/ChompWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(CHOMP_BUNDLE_ID)
    info:
      path: ChompWidget/Info.plist
      properties:
        CFBundleDisplayName: Chomp
        ChompDefaultServerHost: "$(CHOMP_DEFAULT_SERVER_HOST)"
        ChompAppGroup: "group.$(CHOMP_BUNDLE_ID)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CHOMP_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ChompWidget/ChompWidget.entitlements

  ChompTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChompTests
    dependencies:
      - target: Chomp
      - package: LibrariesDev
        product: ThinkingOrbsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CHOMP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Chomp:
    build:
      targets:
        Chomp: all
        ChompTests: [test]
    test:
      targets:
        - ChompTests
    run:
      config: Debug
    archive:
      config: Release
