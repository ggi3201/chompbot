name = "chomp-outside-probe"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# Cron only: no public URL.
workers_dev = false

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "TARGETS"
id = "<your KV namespace id: npx wrangler@3 kv namespace create TARGETS>"

# Secrets, set with `npx wrangler@3 secret put <NAME>`:
#   CHOMP_RESULTS_URL (https://<your webhook host>/api/monitoring/outside)
#   MONITOR_OUTSIDE_SECRET
#   TELEGRAM_ALERTS_BOT_TOKEN
#   TELEGRAM_ALERTS_CHAT_ID (a secret too, so the chat id stays out of the repo)
